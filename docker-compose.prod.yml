version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: botcanchero_app_prod
    restart: always
    expose:
      - "80"
    env_file:
      - .env
    environment:
      APP_ENV: production
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      VIRTUAL_HOST: saas.botcanchero.com
      LETSENCRYPT_HOST: saas.botcanchero.com
      VIRTUAL_PORT: 80
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit((@file_get_contents('http://localhost/health.php')==='ok')?0:1);\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - botnet

networks:
  botnet:
    external: true
    name: ${DOCKER_NETWORK_NAME:-systemwebbotcanchero_botcanchero_net}
